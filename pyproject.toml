[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-engineering-study"
version = "0.1.0"
description = "Deterministic-first graph engineering study lab with a pluggable coding worker."
requires-python = ">=3.10"

[project.scripts]
graph-study = "graph_study.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
